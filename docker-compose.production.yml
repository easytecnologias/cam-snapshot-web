services:
  cam-snapshot-api:
    image: ${CAM_SNAPSHOT_IMAGE:-ghcr.io/easytecnologias/cam-snapshot-web:prod}
    container_name: sightops-prod-api
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      ENABLE_DOCS: ${ENABLE_DOCS:-0}
      DATABASE_BACKEND: postgres
      DATABASE_HOST: sightops-prod-postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${SIGHTOPS_DB:-sightops_prod}
      DATABASE_USER: ${SIGHTOPS_DB_USER:-sightops_prod}
      DATABASE_PASSWORD: ${SIGHTOPS_DB_PASSWORD:?set SIGHTOPS_DB_PASSWORD in .env.production}
      POSTGRES_ENABLED: 1
      AUTH_DATABASE_BACKEND: postgres
      AUTH_REQUIRED: ${AUTH_REQUIRED:-1}
      AUTH_LEGACY_OPEN: ${AUTH_LEGACY_OPEN:-0}
      ENABLE_LEGACY_STATE_IMPORT: ${ENABLE_LEGACY_STATE_IMPORT:-0}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in .env.production}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1}
      SIGHTOPS_SECRET_KEY: ${SIGHTOPS_SECRET_KEY:?set SIGHTOPS_SECRET_KEY in .env.production}
      IMGBB_API_KEY: ${IMGBB_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_VIDEO_MODEL: ${GEMINI_VIDEO_MODEL:-gemini-2.5-flash}
      SIGHTOPS_ACCESS_CONTROL_SYNC_INTERVAL: ${SIGHTOPS_ACCESS_CONTROL_SYNC_INTERVAL:-15}
    volumes:
      - sightops_prod_data:/app/data
      - sightops_prod_output:/app/output
    depends_on:
      sightops-prod-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/system/health/live', timeout=5).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sightops-prod
    restart: unless-stopped

  sightops-prod-nginx:
    image: nginx:1.27-alpine
    container_name: sightops-prod-nginx
    depends_on:
      cam-snapshot-api:
        condition: service_healthy
    ports:
      - "${SIGHTOPS_HTTP_PORT:-8088}:80"
      - "${SIGHTOPS_PUBLIC_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html/v2:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/system/health/live"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sightops-prod
    restart: unless-stopped

  sightops-prod-postgres:
    image: postgres:16-alpine
    container_name: sightops-prod-postgres
    environment:
      POSTGRES_DB: ${SIGHTOPS_DB:-sightops_prod}
      POSTGRES_USER: ${SIGHTOPS_DB_USER:-sightops_prod}
      POSTGRES_PASSWORD: ${SIGHTOPS_DB_PASSWORD:?set SIGHTOPS_DB_PASSWORD in .env.production}
    ports:
      - "127.0.0.1:${SIGHTOPS_POSTGRES_PORT:-5435}:5432"
    volumes:
      - sightops_prod_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SIGHTOPS_DB_USER:-sightops_prod} -d ${SIGHTOPS_DB:-sightops_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sightops-prod
    restart: unless-stopped

  zabbix-prod-postgres:
    image: postgres:16-alpine
    container_name: zabbix-prod-postgres
    environment:
      POSTGRES_DB: ${ZABBIX_DB:-zabbix_prod}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix_prod}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?set ZABBIX_DB_PASSWORD in .env.production}
    volumes:
      - zabbix_prod_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZABBIX_DB_USER:-zabbix_prod} -d ${ZABBIX_DB:-zabbix_prod}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sightops-prod
    restart: unless-stopped

  zabbix-prod-server:
    image: ${ZABBIX_SERVER_IMAGE:-zabbix/zabbix-server-pgsql:alpine-7.0-latest}
    container_name: zabbix-prod-server
    environment:
      DB_SERVER_HOST: zabbix-prod-postgres
      POSTGRES_DB: ${ZABBIX_DB:-zabbix_prod}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix_prod}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?set ZABBIX_DB_PASSWORD in .env.production}
      ZBX_CACHESIZE: ${ZBX_CACHESIZE:-256M}
      ZBX_HISTORYCACHESIZE: ${ZBX_HISTORYCACHESIZE:-128M}
      ZBX_TRENDCACHESIZE: ${ZBX_TRENDCACHESIZE:-128M}
      ZBX_VALUECACHESIZE: ${ZBX_VALUECACHESIZE:-128M}
    ports:
      - "${ZABBIX_SERVER_PORT:-10052}:10051"
    depends_on:
      zabbix-prod-postgres:
        condition: service_healthy
    networks:
      - sightops-prod
    restart: unless-stopped

  zabbix-prod-web:
    image: ${ZABBIX_WEB_IMAGE:-zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest}
    container_name: zabbix-prod-web
    environment:
      ZBX_SERVER_HOST: zabbix-prod-server
      DB_SERVER_HOST: zabbix-prod-postgres
      POSTGRES_DB: ${ZABBIX_DB:-zabbix_prod}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix_prod}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:?set ZABBIX_DB_PASSWORD in .env.production}
      PHP_TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${ZABBIX_WEB_PORT:-8089}:8080"
    depends_on:
      zabbix-prod-server:
        condition: service_started
      zabbix-prod-postgres:
        condition: service_healthy
    networks:
      - sightops-prod
    restart: unless-stopped

  zabbix-prod-agent2:
    image: ${ZABBIX_AGENT_IMAGE:-zabbix/zabbix-agent2:alpine-7.0-latest}
    container_name: zabbix-prod-agent2
    environment:
      ZBX_HOSTNAME: ${ZABBIX_AGENT_HOSTNAME:-sightops-prod-docker-host}
      ZBX_SERVER_HOST: zabbix-prod-server
      ZBX_SERVER_PORT: 10051
    depends_on:
      zabbix-prod-server:
        condition: service_started
    networks:
      - sightops-prod
    restart: unless-stopped

  grafana-prod:
    image: ${GRAFANA_IMAGE:-grafana/grafana-oss:latest}
    container_name: grafana-prod
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env.production}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ${GRAFANA_INSTALL_PLUGINS:-alexanderzobnin-zabbix-app}
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    volumes:
      - grafana_prod_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      zabbix-prod-web:
        condition: service_started
    networks:
      - sightops-prod
    restart: unless-stopped

volumes:
  sightops_prod_data:
  sightops_prod_output:
  sightops_prod_postgres:
  zabbix_prod_postgres:
  grafana_prod_data:

networks:
  sightops-prod:
    name: sightops-prod-platform
